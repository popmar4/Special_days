<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <style>
    :root { --pad: 20px; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe7ef, #fff);
      overflow: hidden;
    }
    .card {
      width: min(560px, calc(100% - 2*var(--pad)));
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
      position: relative;
    }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 38px); }
    p  { margin: 0 0 18px; color: #333; }
    .btn {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:active { transform: scale(.98); }
    #yes {
      background: #ff3b7a;
      color: white;
      filter: drop-shadow(0 10px 18px rgba(255,59,122,.22));
    }
    #no {
      background: #f0f0f0;
      color: #111;
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
    }
    .msg {
      margin-top: 18px;
      font-weight: 600;
      min-height: 28px;
    }
    .small {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p>I promise laughter, affection, and a beautiful plan with you.</p>

    <button class="btn" id="yes">Yes</button>
    <button class="btn" id="no" aria-label="No">No</button>

    <div class="msg" id="msg"></div>
    <div class="small" id="hint">Hint: the “No” button is a bit shy 😄</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const hint = document.getElementById("hint");

    const MAX_ESCAPES = 10;

    let escapes = 0;
    let noUnlocked = false;

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNoButton() {
      const pad = 18;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const rect = noBtn.getBoundingClientRect();
      const bw = rect.width;
      const bh = rect.height;

      const minX = pad;
      const maxX = vw - bw - pad;
      const minY = pad;
      const maxY = vh - bh - pad;

      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      noBtn.style.left = clamp(x, minX, maxX) + "px";
      noBtn.style.top  = clamp(y, minY, maxY) + "px";
      noBtn.style.transform = "none";
    }

    function tease() {
      escapes++;
      const left = MAX_ESCAPES - escapes;

      if (left > 0) {
        hint.textContent = `The “No” button is playing hard to get… (${left})`;
        moveNoButton();
      } else {
        noUnlocked = true;
        hint.textContent = "Alright… if you really want to click it, I’ll let you 😄";
        noBtn.style.cursor = "pointer";
      }
    }

    noBtn.addEventListener("mouseenter", () => { if (!noUnlocked) tease(); });
    noBtn.addEventListener("touchstart", (e) => {
      if (!noUnlocked) { e.preventDefault(); tease(); }
    }, { passive: false });

    noBtn.addEventListener("click", () => {
      if (!noUnlocked) return;
      msg.textContent = "Fair enough 😄 Still, I owe you a nice date sometime.";
      msg.style.color = "#111";
      hint.textContent = "Thanks for playing along 💛";
    });

    yesBtn.addEventListener("click", () => {
      msg.textContent = "YESS! 💞 So… when and where? 😏";
      msg.style.color = "#ff3b7a";
      hint.textContent = "I love you. Happy Valentine’s Day 💘";
    });
  </script>
</body>
</html>
