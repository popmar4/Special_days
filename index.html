<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ira, will you be my Valentine?</title>

  <style>
    :root { --pad: 20px; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe7ef, #fff);
      overflow: hidden;
    }

    .card {
      width: min(720px, calc(100% - 2*var(--pad)));
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
      position: relative; /* important: anchor for absolute No */
      overflow: hidden;   /* keep No inside card */
    }

    h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 38px); }
    p  { margin: 0 0 18px; color: #333; }

    .buttons {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .btn {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:active { transform: scale(.98); }

    #yes {
      background: #ff3b7a;
      color: white;
      filter: drop-shadow(0 10px 18px rgba(255,59,122,.22));
    }

    #no {
      background: #f0f0f0;
      color: #111;
    }

    #backBtn {
      display: none;
      margin-top: 14px;
      background: #111;
      color: #fff;
      opacity: .9;
    }

    #dateOptions {
      display: none;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .optionsGrid {
      display: grid;
      gap: 10px;
      margin-top: 10px;
      justify-content: center;
    }

    .optionBtn {
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      color: #111;
      text-align: left;
      width: min(560px, 100%);
    }

    .msg {
      margin-top: 18px;
      font-weight: 600;
      min-height: 28px;
    }

    .small {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      min-height: 18px;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Ira, will you be my Valentine? 💘</h1>
    <p>I go to bed thinking about you and I wake up with you on my mind. Inbetween I dream with you. I love you.</p>

    <div class="buttons" id="buttonsRow">
      <button class="btn" id="yes">Yes</button>
      <button class="btn" id="no">No</button>
    </div>

    <button class="btn" id="backBtn">Back ↩</button>

    <div id="dateOptions">
      <p style="margin: 14px 0 0;">My date ideas 👇</p>

      <div class="optionsGrid" id="optionsGrid">
        <button class="btn optionBtn" data-choice="Sushi dinner 🍣">Our sushi dinner 🍣</button>
        <button class="btn optionBtn" data-choice="Cinema night 🎬">Movie night in the cinema (a movie you liked just came out 😏) 🎬</button>
        <button class="btn optionBtn" data-choice="Ice-skating at SAP Garden ⛸️">Ice-skating at SAP Garden ⛸️</button>
        <button class="btn optionBtn" data-choice="Therme Erding + sauna 🌡️">Therme Erding (we still have the 2 coupons) 🌡️</button>
      </div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="small" id="hint">Hint: the “No” button is a bit shy and doesn’t give up (just like me) 😄</div>
  </div>

  <script>
    const card = document.getElementById("card");
    const buttonsRow = document.getElementById("buttonsRow");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const backBtn = document.getElementById("backBtn");
    const msg = document.getElementById("msg");
    const hint = document.getElementById("hint");
    const dateOptions = document.getElementById("dateOptions");
    const optionsGrid = document.getElementById("optionsGrid");

    const MAX_ESCAPES = 10;

    const defaultHint = "Hint: the “No” button is a bit shy and doesn’t give up (just like me) 😄";

    let escapes = 0;
    let noUnlocked = false;
    let yesClicked = false;

    // Keep original place in row
    const originalParent = buttonsRow;
    const originalNextSibling = null; // we just append back to row

    function placeNoInCardForMoving() {
      if (noBtn.parentElement !== card) {
        card.appendChild(noBtn);
      }
      noBtn.style.position = "absolute";
      noBtn.style.zIndex = "3";
    }

    function resetNoBackToRow() {
      // put back into the button row and reset styles
      if (noBtn.parentElement !== originalParent) {
        originalParent.appendChild(noBtn);
      }
      noBtn.style.position = "";
      noBtn.style.left = "";
      noBtn.style.top = "";
      noBtn.style.zIndex = "";
    }

    function moveNoButtonInsideCard() {
      const pad = 12;

      placeNoInCardForMoving();

      // Use card inner box sizes so it never leaves
      const maxX = card.clientWidth - noBtn.offsetWidth - pad;
      const maxY = card.clientHeight - noBtn.offsetHeight - pad;

      const x = Math.max(pad, Math.floor(Math.random() * (maxX - pad + 1)));
      const y = Math.max(pad, Math.floor(Math.random() * (maxY - pad + 1)));

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    function tease() {
      if (yesClicked) return;

      escapes++;
      const left = MAX_ESCAPES - escapes;

      if (left > 0) {
        hint.textContent = `The “No” button is playing hard to get… (${left})`;
        moveNoButtonInsideCard();
      } else {
        noUnlocked = true;
        hint.textContent = "Alright… now you can click it 😄";
      }
    }

    // Desktop hover
    noBtn.addEventListener("mouseenter", () => {
      if (!noUnlocked) tease();
    });

    // Mobile touch
    noBtn.addEventListener("touchstart", (e) => {
      if (yesClicked) return;
      if (!noUnlocked) { e.preventDefault(); tease(); }
    }, { passive: false });

    noBtn.addEventListener("click", () => {
      if (!noUnlocked) return;

      msg.textContent = "Fair enough 😄 I still love you for ETERNITY :)";
      msg.style.color = "#111";
      hint.textContent = "Thanks for playing along 💛";
    });

    yesBtn.addEventListener("click", () => {
      yesClicked = true;

      // after Yes: stop moving + put No back nicely into the row
      resetNoBackToRow();

      msg.textContent = "YESS! 💞";
      msg.style.color = "#ff3b7a";
      hint.textContent = "Now choose our date idea 💘";

      dateOptions.style.display = "block";
      backBtn.style.display = "inline-block";
    });

    optionsGrid.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-choice]");
      if (!btn) return;

      const choice = btn.getAttribute("data-choice");
      msg.textContent = `Perfect 😍 We’ll do: ${choice}`;
      msg.style.color = "#ff3b7a";
      hint.textContent = "Deal. Happy Valentine’s Day 💘 I love you and miss you so much!";

      // visual highlight
      [...optionsGrid.querySelectorAll("button[data-choice]")].forEach(b => b.style.filter = "");
      btn.style.filter = "brightness(0.95)";
    });

    // Back button: return to start state (so she can change her mind)
    backBtn.addEventListener("click", () => {
      yesClicked = false;
      escapes = 0;
      noUnlocked = false;

      resetNoBackToRow();

      dateOptions.style.display = "none";
      backBtn.style.display = "none";

      msg.textContent = "";
      hint.textContent = defaultHint;

      // clear option highlight
      [...optionsGrid.querySelectorAll("button[data-choice]")].forEach(b => b.style.filter = "");
    });
  </script>
</body>
</html>
