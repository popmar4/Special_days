<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ira, will you be my Valentine?</title>

  <style>
    :root { --pad: 20px; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe7ef, #fff);
      overflow: hidden;
    }

    .card {
      width: min(560px, calc(100% - 2*var(--pad)));
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 38px); }
    p  { margin: 0 0 18px; color: #333; }

    .buttons {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      position: relative;
      z-index: 2; /* stays above moving No */
    }

    .btn {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, filter .12s ease;
    }

    .btn:active { transform: scale(.98); }

    #yes {
      background: #ff3b7a;
      color: white;
      filter: drop-shadow(0 10px 18px rgba(255,59,122,.22));
    }

    #no {
      background: #f0f0f0;
      color: #111;
    }

    #dateOptions {
      display: none;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .optionsGrid {
      display: grid;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .optionBtn {
      background: white;
      border: 1px solid rgba(0,0,0,.08);
      color: #111;
      text-align: left;
    }

    .msg {
      margin-top: 18px;
      font-weight: 600;
      min-height: 28px;
    }

    .small {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      min-height: 18px;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Ira, will you be my Valentine? 💘</h1>
    <p>I promise laughter, affection, and a beautiful plan with you.</p>

    <div class="buttons" id="buttonsRow">
      <button class="btn" id="yes">Yes</button>
      <button class="btn" id="no">No</button>
    </div>

    <div id="dateOptions">
      <p style="margin: 14px 0 0;">My date ideas 👇</p>

      <div class="optionsGrid">
        <button class="btn optionBtn" data-choice="Sushi dinner 🍣">Our sushi dinner 🍣</button>
        <button class="btn optionBtn" data-choice="Cinema night 🎬">Movie night in the cinema (a movie you liked just came out 😏) 🎬</button>
        <button class="btn optionBtn" data-choice="Ice-skating at SAP Garden ⛸️">Ice-skating at SAP Garden ⛸️</button>
        <button class="btn optionBtn" data-choice="Therme Erding + sauna 🌡️">Therme Erding (we still have the 2 coupons) 🌡️</button>
      </div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="small" id="hint">Hint: the “No” button is a bit shy and doesn’t give up (just like me) 😄</div>
  </div>

  <script>
    const card = document.getElementById("card");
    const buttonsRow = document.getElementById("buttonsRow");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const hint = document.getElementById("hint");
    const dateOptions = document.getElementById("dateOptions");

    const MAX_ESCAPES = 10;

    let escapes = 0;
    let noUnlocked = false;
    let yesClicked = false;

    function moveNoButton() {
      const pad = 12;

      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const minX = pad;
      const minY = pad;
      const maxX = cardRect.width - btnRect.width - pad;
      const maxY = cardRect.height - btnRect.height - pad;

      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      noBtn.style.position = "absolute";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.zIndex = 3; // stay above
    }

    function resetNoButtonToRow() {
      // Put it back next to "Yes" and stop absolute positioning
      noBtn.style.position = "";
      noBtn.style.left = "";
      noBtn.style.top = "";
      noBtn.style.zIndex = "";
      // Ensure it sits in the row again
      buttonsRow.appendChild(noBtn);
    }

    function tease() {
      if (yesClicked) return;

      escapes++;
      const left = MAX_ESCAPES - escapes;

      if (left > 0) {
        hint.textContent = `The “No” button is playing hard to get… (${left})`;
        moveNoButton();
      } else {
        noUnlocked = true;
        hint.textContent = "Alright… now you can click it 😄";
      }
    }

    // Desktop
    noBtn.addEventListener("mouseenter", () => { if (!noUnlocked) tease(); });

    // Mobile / touch
    noBtn.addEventListener("touchstart", (e) => {
      if (yesClicked) return;
      if (!noUnlocked) { e.preventDefault(); tease(); }
    }, { passive: false });

    noBtn.addEventListener("click", () => {
      if (!noUnlocked) return;

      msg.textContent = "Fair enough 😄 I still love you for ETERNITY :)";
      msg.style.color = "#111";
      hint.textContent = "Thanks for playing along 💛";
    });

    yesBtn.addEventListener("click", () => {
      yesClicked = true;

      // after Yes: stop moving + put No back neatly
      resetNoButtonToRow();

      msg.textContent = "YESS! 💞";
      msg.style.color = "#ff3b7a";
      hint.textContent = "Now choose our date idea 💘";

      dateOptions.style.display = "block";
    });

    dateOptions.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-choice]");
      if (!btn) return;

      const choice = btn.getAttribute("data-choice");

      msg.textContent = `Perfect 😍 We’ll do: ${choice}`;
      msg.style.color = "#ff3b7a";
      hint.textContent = "Deal. Happy Valentine’s Day 💘 I love you and miss you so much!";
    });
  </script>
</body>
</html>
