<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>¿Quieres ser mi Valentín?</title>
  <style>
    :root { --pad: 20px; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffe7ef, #fff);
      overflow: hidden;
    }
    .card {
      width: min(560px, calc(100% - 2*var(--pad)));
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
      position: relative;
    }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 38px); }
    p  { margin: 0 0 18px; color: #333; }
    .btn {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:active { transform: scale(.98); }
    #yes {
      background: #ff3b7a;
      color: white;
      filter: drop-shadow(0 10px 18px rgba(255,59,122,.22));
    }
    #no {
      background: #f0f0f0;
      color: #111;
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
    }
    .msg {
      margin-top: 18px;
      font-weight: 600;
      min-height: 28px;
    }
    .small {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>¿Quieres ser mi Valentín? 💘</h1>
    <p>Prometo risas, mimos y un plan bonito contigo.</p>

    <button class="btn" id="yes">Sí</button>
    <button class="btn" id="no" aria-label="No">No</button>

    <div class="msg" id="msg"></div>
    <div class="small" id="hint">Pista: el “No” es un poco tímido 😄</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const hint = document.getElementById("hint");

    // Ajusta esto: cuántas veces "se escapa" antes de dejarse pulsar.
    const MAX_ESCAPES = 10;

    let escapes = 0;
    let noUnlocked = false;

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNoButton() {
      const pad = 18;

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const rect = noBtn.getBoundingClientRect();
      const bw = rect.width;
      const bh = rect.height;

      // zona segura dentro de la ventana
      const minX = pad;
      const maxX = vw - bw - pad;
      const minY = pad;
      const maxY = vh - bh - pad;

      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      noBtn.style.left = clamp(x, minX, maxX) + "px";
      noBtn.style.top  = clamp(y, minY, maxY) + "px";
      noBtn.style.transform = "none";
    }

    function tease() {
      escapes++;
      const left = MAX_ESCAPES - escapes;

      if (left > 0) {
        hint.textContent = `El “No” se está haciendo el interesante… (${left})`;
        moveNoButton();
      } else {
        // Se desbloquea: ya puede pulsarse
        noUnlocked = true;
        hint.textContent = "Ok ok… si de verdad quieres pulsarlo, ahora te dejo 😄";
        noBtn.style.cursor = "pointer";
      }
    }

    // Se escapa al acercar ratón o tocar (móvil), pero solo hasta MAX_ESCAPES
    noBtn.addEventListener("mouseenter", () => { if (!noUnlocked) tease(); });
    noBtn.addEventListener("touchstart", (e) => {
      if (!noUnlocked) { e.preventDefault(); tease(); }
    }, { passive: false });

    // Click en No (cuando ya se desbloquea)
    noBtn.addEventListener("click", () => {
      if (!noUnlocked) return; // por si acaso
      msg.textContent = "Vale 😄 Aun así, te invito a un plan bonito cuando quieras.";
      msg.style.color = "#111";
      hint.textContent = "Gracias por jugar conmigo 💛";
    });

    // Click en Sí
    yesBtn.addEventListener("click", () => {
      msg.textContent = "¡SÍÍÍ! 💞 Entonces… ¿cuándo y dónde? 😏";
      msg.style.color = "#ff3b7a";
      hint.textContent = "Te quiero. Feliz San Valentín 💘";
    });

    // Inicial: coloca el No en posición agradable
    // (si redimensiona, que no se quede fuera)
    window.addEventListener("resize", () => {
      // si está desbloqueado, no lo muevas automáticamente; si no, recolócalo
      if (!noUnlocked) {
        noBtn.style.left = "50%";
        noBtn.style.top = "62%";
        noBtn.style.transform = "translate(-50%, -50%)";
      }
    });
  </script>
</body>
</html>
